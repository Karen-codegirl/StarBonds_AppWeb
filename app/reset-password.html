<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonds · Recuperar contraseña</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">Star<span>Bonds</span></a>
    <ul class="nav-links">
      <li><a href="login.html">Volver</a></li>
    </ul>
  </nav>

  <main class="contenedor-estrecho">
    <div class="auth-card">
      <div class="auth-logo">Star<span>Bonds</span></div>
      <p class="auth-sub">Crea una nueva contraseña.</p>

      <form id="reset-form">
        <div class="campo">
          <label for="new-password">Nueva contraseña</label>
          <input type="password" id="new-password" placeholder="Mínimo 6 caracteres" minlength="6" required />
        </div>

        <div class="campo">
          <label for="confirm-password">Confirmar contraseña</label>
          <input type="password" id="confirm-password" placeholder="Repite tu contraseña" minlength="6" required />
        </div>

        <button type="submit" class="btn btn-primario btn-bloque">Guardar contraseña</button>
      </form>

      <p id="reset-status" class="center muted" style="margin-top: 18px; font-size: 0.9rem; min-height: 22px;"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script>
    const form = document.getElementById("reset-form");
    const statusEl = document.getElementById("reset-status");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "#ff9aa2" : "#b9a9d6";
    }

    async function comprobarSesion() {
      if (!supabaseClient) {
        setStatus("La recuperación de contraseña no está disponible en este momento.", true);
        form.style.display = "none";
        return;
      }

      const { data: { session }, error } = await supabaseClient.auth.getSession();

      if (error) {
        setStatus("El enlace de recuperación es inválido o ha expirado.", true);
        form.style.display = "none";
        return;
      }

      if (!session) {
        setStatus("Abre este enlace desde el correo que te enviamos para continuar.", true);
        form.style.display = "none";
        return;
      }

      setStatus("Tu enlace es válido. Puedes establecer tu nueva contraseña.");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!supabaseClient) {
        toast("La recuperación no está disponible");
        return;
      }

      const pass = document.getElementById("new-password").value;
      const confirm = document.getElementById("confirm-password").value;

      if (pass.length < 6) {
        setStatus("La contraseña debe tener al menos 6 caracteres.", true);
        return;
      }

      if (pass !== confirm) {
        setStatus("Las contraseñas no coinciden.", true);
        return;
      }

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: pass });

        if (error) throw error;

        setStatus("Contraseña actualizada correctamente.");
        toast("Contraseña actualizada ✅");
        form.reset();

        setTimeout(() => {
          location.href = "login.html";
        }, 1200);
      } catch (err) {
        console.error("Error al actualizar contraseña:", err);
        setStatus(err.message || "No se pudo actualizar la contraseña.", true);
      }
    });

    comprobarSesion();
  </script>
</body>
</html>
