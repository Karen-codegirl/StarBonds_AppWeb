<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarBonds - Registro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">Star<span>Bonds</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="registro.html" class="activo">Registro</a></li>
      <li><a href="precios.html">Precios</a></li>
      <li><a href="comunidad.html">Comunidad</a></li>
    </ul>
  </nav>

  <main class="contenedor">
    <section class="seccion">
      <h2>Crea tu cuenta en Bonds</h2>

      <!-- Formulario de registro.
           El atributo "required" obliga a llenar el campo.
           action="#" es un marcador: aquí después conectas tu servidor. -->
      <form class="form-registro" action="#" method="post">

        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />
        </div>

        <div class="campo">
          <label for="usuario">Nombre de usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="usuario123" required />
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>

        <div class="campo">
          <label for="password2">Confirmar contraseña</label>
          <input type="password" id="password2" name="password2" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primario" style="width:100%">
          Registrarme
        </button>

        <p style="text-align:center; margin-top:16px; color:var(--color-texto-suave)">
          ¿Ya tienes cuenta? <a href="#" style="color:var(--color-acento)">Inicia sesión</a>
        </p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 StarBonds. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
